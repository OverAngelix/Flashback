server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api, /media et /ws sont routés vers le serveur par Traefik : arriver ici signifie que la route manque
    location ^~ /api/ {
        return 502;
    }
    location ^~ /media/ {
        return 502;
    }
    location = /ws {
        return 502;
    }

    # Fichiers de Vite, nommés d'après leur contenu
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Routes du client (/host, /play, /join/CODE…) ; index.html jamais en cache pour suivre les mises à jour
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
