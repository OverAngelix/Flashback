# Le client porte le domaine. /api, /media et /ws (WebSocket) partent vers le serveur :
# règle plus longue donc prioritaire, sans stripPrefix (le serveur attend ces chemins).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flashback-client
  namespace: dev
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`<DOMAINE>`) && (PathPrefix(`/api`) || PathPrefix(`/media`) || Path(`/ws`))
      kind: Rule
      services:
        - name: flashback-server
          port: 3000
    - match: Host(`<DOMAINE>`)
      kind: Rule
      services:
        - name: flashback-client
          port: 80
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flashback-client-http
  namespace: dev
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`<DOMAINE>`)
      kind: Rule
      services:
        - name: flashback-client
          port: 80
      middlewares:
        - name: https-redirect
